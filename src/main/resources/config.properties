# ── MCP Server (JSON-RPC 2.0) ────────────────────────────────────────────────
# Full JSON-RPC endpoint URL (from Image 1)
mcp.endpoint=

# MCP tool name (the "name" field in params)
mcp.tool.name=search_jira_issues

# JIRA project key used in the JQL query
jira.project=ATH

# Bearer token / API key for MCP server (leave blank if not required)
mcp.api.key=

# ── LLM (Internal OpenAI-compatible endpoint) ─────────────────────────────────
# Full chat completions URL (from Image 2)
llm.endpoint=

# Bearer token / API key for LLM endpoint
llm.api.key=

# Model name (from Image 2: codestral-latest-ITG)
llm.model=codestral-latest-ITG

# ── Master Slide Template ─────────────────────────────────────────────────────
# Optional: absolute path to your branded .pptx template.
# Leave blank to generate clean white slides.
# You can also select it at runtime via the Browse button.
master.slide.path=
